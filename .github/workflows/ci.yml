name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  validar:
    name: Validar API, código y dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias exactas
        run: npm ci
      - name: Validar código, versiones y catálogos
        run: npm run validate
      - name: Probar endpoints de la API
        run: npm run test:api
      - name: Verificar árbol de dependencias
        run: npm ls --all
      - name: Auditar dependencias
        run: npm audit --audit-level=high

  seguridad:
    name: Analizar seguridad JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v3
